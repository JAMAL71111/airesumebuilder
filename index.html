<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <!-- إعدادات اللغة والترميز الأساسية -->
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Language" content="ar">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no" />
    
    <!-- الرابط الأساسي (مهم جداً لمحركات البحث وعناكب أدسنس لمنع ازدواجية المحتوى) -->
    <link rel="canonical" href="https://fareestate.com/" />
    
    <!-- التحقق من ملكية الموقع لجوجل (مهم جداً - لا تقم بتعديله) -->
    <meta name="google-site-verification" content="RuYqGQoWZ1NLaDd6EnZDDYhIXfxWx_xMttxgnKshNnU" />
    
    <!-- استدعاء خط Tajawal ليتناسب مع التصميم الجديد -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    
    <!-- عنوان الموقع -->
    <title>Fareestate | صانع السيرة الذاتية ومستشارك المهني</title>
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    
    <!-- الوصف (تم توسيعه ليقرأه أدسنس كأداة قوية ومفيدة) -->
    <meta name="description" content="Fareestate منصة التوظيف والتطوير المهني لإنشاء سيرة ذاتية احترافية مجاناً. أداة متطورة لتصميم السيرة الذاتية بسهولة والحصول على نصائح مهنية لاجتياز المقابلات.">
    
    <!-- الكلمات المفتاحية (لتسهيل ظهورك في نتائج البحث) -->
    <meta name="keywords" content="سيرة ذاتية, صانع سيرة ذاتية, إنشاء CV, قوالب سيرة ذاتية, وظائف, Fareestate, Resume builder, تطوير مهني, جمال حميد الشمهاني">
    
    <!-- معلومات المؤلف وعناكب الأرشفة -->
    <meta name="author" content="جمال حميد الشمهاني">
    <meta name="robots" content="index, follow, max-image-preview:large">

    <!-- علامات الميتا المفتوحة (Open Graph) لرفع موثوقية زاحف جوجل -->
    <meta property="og:title" content="Fareestate | صانع السيرة الذاتية ومستشارك المهني">
    <meta property="og:description" content="منصة التوظيف والتطوير المهني لإنشاء سيرة ذاتية احترافية مجاناً.">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="ar_AR">
  </head>
  <body>
    <!-- الحاوية الأساسية التي سيعرض فيها React موقعك بالكامل -->
    <div id="root"></div>
    
    <!-- السكريبت المسؤول عن تشغيل المشروع -->
    <script type="module" src="/src/main.tsx"></script>

    <!-- سكريبت توجيه جميع عناصر الموقع ديناميكياً -->
    <script>
      // استبدل الروابط أدناه بالروابط الحقيقية التي تريد توجيه المستخدم إليها
      const siteLinksMap = {
        'الرئيسية': 'https://example.com/home',
        'المدونة والنصائح': 'https://example.com/blog',
        'من نحن': 'https://example.com/about',
        'اتصل بنا': 'https://example.com/contact',
        'اقرأ المزيد': 'https://example.com/post-details',
        'سياسة الخصوصية': 'https://example.com/privacy',
        'شروط الاستخدام': 'https://example.com/terms'
      };

      document.addEventListener('click', function(event) {
        const target = event.target.closest('a, button, span, div, li');
        if (!target) return;

        const text = target.textContent.trim();

        for (const [key, url] of Object.entries(siteLinksMap)) {
          if (text.includes(key)) {
            event.preventDefault();
            event.stopPropagation();
            window.location.href = url;
            return;
          }
        }
      }, true);
    </script>
  </body>
</html>
